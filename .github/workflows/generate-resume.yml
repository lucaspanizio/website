name: Generate Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/resume/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ !contains(join(github.event.commits.*.message, ' '), '[skip-resume]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate:resume

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📄 chore: atualiza pdf do currículo"
          file_pattern: 'public/*.pdf'
